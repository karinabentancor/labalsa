</div>

        <!-- ---- Sección Taller de Canto con Rossana Taddei ---- -->
        <section class="taller" id="taller-canto">
            <img src="media/taller-taddei.png" alt="Taller de canto con Rossana Taddei" class="taller-img">
            <div class="taller-info">
                <p class="taller-titulo">TALLER DE CANTO CON <span class="taller-nombre">ROSSANA TADDEI</span></p>
                <p class="taller-fecha">Domingo 11 de Octubre  17 hs.<br>AEBU (Puig 561)</p>
                <button type="button" id="btn-inscribirme" class="btn-inscribirme">Inscribirme</button>
            </div>
        </section>
    </div>

    <!-- ---- Modal de inscripción al taller ---- -->
    <div id="modal-inscripcion" class="modal-taller-overlay" hidden>
        <div class="modal-taller-box" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
            <button type="button" id="modal-close" class="modal-taller-close" aria-label="Cerrar">&times;</button>
            <h3 id="modal-titulo">Inscripción al taller de canto</h3>
            <form id="form-inscripcion">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div>
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>
                <div>
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" min="1" max="120" required>
                </div>
                <div>
                    <label for="telefono">Teléfono de contacto</label>
                    <input type="tel" id="telefono" name="telefono" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <button type="submit" class="btn-enviar" id="btn-enviar">Enviar inscripción</button>
                <p id="form-status" class="form-status" role="status"></p>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
