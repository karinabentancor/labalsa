<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>La Balsa — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --amarillo:#ffd813;
    --azul:#0077b6;
    --fondo:#0a1628;
    --panel:rgba(255,255,255,0.04);
    --borde:rgba(255,216,19,0.25);
  }
  *{box-sizing:border-box;}
  html, body{ overflow-x:hidden; }
  body{
    margin:0; min-height:100vh;
    font-family:'JetBrains Mono', monospace;
    background:radial-gradient(circle at 20% 0%, #102338 0%, var(--fondo) 55%);
    color:#eaf2f8;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .wrap{ width:100%; max-width:640px; position:relative; }
  .logo-top{ display:flex; justify-content:center; margin-bottom:28px; }
  .logo-top img{ height:130px; filter:drop-shadow(0 4px 16px rgba(255,216,19,0.35)); }
  .card{
    background:var(--panel);
    border:1px solid var(--borde);
    border-radius:8px;
    padding:36px;
  }
  h1{
    font-size:16px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--amarillo); margin:0 0 26px; font-weight:800;
  }
  label{
    display:block; font-size:11px; letter-spacing:.08em;
    color:rgba(234,242,248,0.6); margin-bottom:8px; margin-top:20px;
    text-transform:uppercase; font-weight:700;
  }
  input, textarea, select{
    width:100%; padding:14px 16px;
    background:rgba(255,255,255,0.06);
    border:1.5px solid rgba(255,216,19,0.2);
    border-radius:6px;
    color:#eaf2f8;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
  }
  textarea{ min-height:140px; resize:vertical; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--amarillo); }
  input[type=file]{ padding:12px; font-size:12px; }
  button{
    margin-top:28px;
    width:100%;
    padding:18px;
    background:var(--amarillo);
    border:none; border-radius:6px;
    color:#0a1628; font-weight:800;
    font-family:'JetBrains Mono', monospace;
    letter-spacing:.08em; text-transform:uppercase;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  button:hover{ transform:translateY(-1px); box-shadow:0 8px 24px rgba(255,216,19,0.25); }
  button:disabled{ opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }

  /* Botón salir: vive afuera de la tarjeta, arriba a la derecha.
     Mobile-first: apilado y alineado a la derecha, sin desborde.
     En pantallas grandes (ver media query más abajo) flota afuera de la tarjeta. */
  .btn-salir{
    display:none;
    width:fit-content;
    max-width:100%;
    margin:0 0 16px auto;
    padding:10px 16px;
    background:rgba(255,120,120,0.1);
    border:1.5px solid rgba(255,120,120,0.5);
    color:#ff8a8a;
    font-size:11px;
    letter-spacing:.06em;
    line-height:1.4;
    text-align:right;
    white-space:normal;
    box-shadow:none;
  }
  .btn-salir:hover{
    background:rgba(255,120,120,0.18);
    transform:none;
    box-shadow:none;
  }

  /* Campo de contraseña con ojito */
  .campo-pass{ position:relative; }
  .campo-pass input{ padding-right:48px; }
  .btn-ojo{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(calc(-50% + 4px));
    width:36px;
    height:32px;
    margin:0;
    padding:6px;
    background:var(--amarillo);
    border:1.5px solid var(--amarillo);
    border-radius:5px;
    color:#0077b6;
    display:flex; align-items:center; justify-content:center;
    box-shadow:none;
  }
  .btn-ojo:hover{
    background:#ffe873;
    border-color:#ffe873;
    color:#005a8a;
    transform:translateY(calc(-50% + 4px));
    box-shadow:none;
  }
  .btn-ojo svg{ width:20px; height:20px; stroke-width:2.2; }

  #msg{ margin-top:16px; font-size:13px; line-height:1.5; }
  #msg2{ margin-top:16px; font-size:13px; line-height:1.5; }
  #msgRev{ margin-top:16px; font-size:13px; line-height:1.5; }
  #msgTrip{ margin-top:16px; font-size:13px; line-height:1.5; }
  #msgCruce{ margin-top:16px; font-size:13px; line-height:1.5; }
  .ok{ color:#7be0a0; }
  .error{ color:#ff8a8a; }
  .fila-doble{ display:flex; gap:14px; }
  .fila-doble > div{ flex:1; }
  .top-bar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:24px;
  }
  .tabs{
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:10px; margin-bottom:28px;
  }
  .tab-btn{
    margin:0; padding:14px 6px;
    min-width:0;
    background:transparent;
    border:1.5px solid rgba(255,216,19,0.25);
    color:rgba(234,242,248,0.6);
    font-weight:700; font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tab-btn.activo{
    background:var(--amarillo);
    color:#0a1628;
    border-color:var(--amarillo);
  }
  .tab-panel{ display:none; }
  .tab-panel.activo{ display:block; }
  .lista{ margin-top:36px; }
  .lista label{ margin-top:0; }
  .item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.08);
    font-size:13px;
  }
  .item span.num{ color:var(--amarillo); font-weight:800; margin-right:10px; }
  .item button{
    width:auto; margin:0; padding:8px 14px; font-size:11px;
    background:transparent; border:1.5px solid rgba(255,120,120,0.5); color:#ff8a8a;
  }
  #panelLogin, #panelPrincipal{ display:none; }
  .actual-badge{
    display:inline-block; background:rgba(255,216,19,0.15);
    color:var(--amarillo); font-size:10px; font-weight:800;
    letter-spacing:.08em; text-transform:uppercase;
    padding:4px 10px; border-radius:20px; margin-bottom:16px;
  }

  /* Pantallas grandes: contenedor más ancho y elementos más cómodos */
  @media (min-width: 900px){
    .wrap{ max-width:980px; }
    .logo-top img{ height:170px; }
    .card{ padding:56px; }
    h1{ font-size:19px; }
    label{ font-size:12px; }
    input, textarea, select{ padding:16px 18px; font-size:15px; }
    button{ padding:20px; font-size:15px; }
    .tabs{ grid-template-columns:repeat(4, minmax(0, 1fr)); }
    .tab-btn{ padding:20px; font-size:14px; }
    .btn-salir{
      margin:0 0 20px auto;
      padding:14px 24px;
      font-size:13px;
    }
    .item{ font-size:14px; padding:16px 0; }
  }

  /* Pantalla de login en pantallas grandes: mitad izquierda formulario, mitad derecha logo grande */
  @media (min-width: 900px){
    body.vista-login .wrap{
      max-width:1180px;
      display:flex;
      align-items:center;
      gap:70px;
    }
    body.vista-login .btn-salir{ display:none !important; }
    body.vista-login .logo-top{
      order:2;
      flex:1 1 0;
      margin-bottom:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    body.vista-login .logo-top img{
      height:320px;
    }
    body.vista-login .card{
      order:1;
      flex:0 1 440px;
    }
  }
</style>
</head>
<body>

<div class="wrap">

  <button class="btn-salir" id="btnLogout">✕ Salir</button>

  <div class="logo-top">
    <img src="media/balsaA.svg" alt="La Balsa">
  </div>

  <div class="card">

    <div id="panelLogin">
      <h1>Panel administrador</h1>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" autocomplete="username">
      <label for="loginPass">Contraseña</label>
      <div class="campo-pass">
        <input type="password" id="loginPass" autocomplete="current-password">
        <button type="button" class="btn-ojo" id="btnOjo" aria-label="Mostrar contraseña">
          <svg id="iconoOjo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.7 19.7 0 0 1 4.22-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>
      <button id="btnLogin">Ingresar</button>
      <div id="msg"></div>
    </div>

    <div id="panelPrincipal">
      <div class="top-bar">
        <h1 style="margin:0;">Panel administrador</h1>
      </div>

      <div class="tabs">
        <button class="tab-btn activo" id="tabBtnRadio">Radio</button>
        <button class="tab-btn" id="tabBtnRevista">Revista</button>
        <button class="tab-btn" id="tabBtnCruces">Cruces</button>
        <button class="tab-btn" id="tabBtnTripulantes">Tripulantes</button>
      </div>

      <div class="tab-panel activo" id="tabRadio">
        <div class="fila-doble">
          <div>
            <label for="numero">programa</label>
            <input type="number" id="numero" placeholder="66">
          </div>
          <div>
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha">
          </div>
        </div>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" placeholder="En este programa..."></textarea>

        <label for="audio">Archivo de audio (mp3)</label>
        <input type="file" id="audio" accept="audio/*">

        <button id="btnSubir">Publicar programa</button>
        <div id="msg2"></div>

        <div class="lista">
          <label>Últimos programas publicados</label>
          <div id="listaProgramas"></div>
        </div>
      </div>

      <div class="tab-panel" id="tabRevista">
        <span class="actual-badge">Esto reemplaza la edición mostrada en la web</span>

        <div class="fila-doble">
          <div>
            <label for="revNumero">N° de edición</label>
            <input type="number" id="revNumero" placeholder="2">
          </div>
          <div>
            <label for="revTemporada">Temporada</label>
            <input type="text" id="revTemporada" placeholder="Invierno 2026">
          </div>
        </div>

        <label for="revTexto">Texto de presentación</label>
        <textarea id="revTexto" placeholder="El pasado... presentamos el número..."></textarea>

        <label for="revPortada">Imagen de portada</label>
        <input type="file" id="revPortada" accept="image/*">

        <label for="revPdf">Archivo PDF de la revista</label>
        <input type="file" id="revPdf" accept="application/pdf">

        <button id="btnSubirRevista">Publicar edición</button>
        <div id="msgRev"></div>

        <div class="lista">
          <label>Ediciones publicadas</label>
          <div id="listaRevistas"></div>
        </div>
      </div>

      <div class="tab-panel" id="tabCruces">
        <label for="cruceTitulo">Título</label>
        <input type="text" id="cruceTitulo" placeholder="Nombre del cruce">

        <label for="cruceDescripcion">Descripción</label>
        <textarea id="cruceDescripcion" placeholder="Texto de presentación..."></textarea>

        <label for="cruceImagen">Imagen de portada</label>
        <input type="file" id="cruceImagen" accept="image/*">

        <label for="cruceTipo">Tipo de contenido</label>
        <select id="cruceTipo">
          <option value="enlace">Enlace externo</option>
          <option value="audio">Archivo de audio</option>
          <option value="imagen">Imagen adicional</option>
        </select>

        <div id="cruceCampoEnlace">
          <label for="cruceEnlace">URL del enlace</label>
          <input type="text" id="cruceEnlace" placeholder="https://...">
        </div>

        <div id="cruceCampoAudio" style="display:none">
          <label for="cruceAudio">Archivo de audio</label>
          <input type="file" id="cruceAudio" accept="audio/*">
        </div>

        <div id="cruceCampoImagen" style="display:none">
          <label for="cruceImagenExtra">Imagen adicional</label>
          <input type="file" id="cruceImagenExtra" accept="image/*">
        </div>

        <button id="btnSubirCruce">Publicar cruce</button>
        <div id="msgCruce"></div>

        <div class="lista">
          <label>Cruces publicados</label>
          <div id="listaCruces"></div>
        </div>
      </div>

      <div class="tab-panel" id="tabTripulantes">
        <label for="tripNombre">Nombre</label>
        <input type="text" id="tripNombre" placeholder="Nombre y apellido">

        <label for="tripDescripcion">Descripción</label>
        <textarea id="tripDescripcion" placeholder="Un párrafo sobre esta persona..."></textarea>

        <label for="tripFoto">Foto</label>
        <input type="file" id="tripFoto" accept="image/*">

        <button id="btnSubirTripulante">Agregar tripulante</button>
        <div id="msgTrip"></div>

        <div class="lista">
          <label>Tripulantes agregados</label>
          <div id="listaTripulantes"></div>
        </div>
      </div>

    </div>

  </div>
</div>

<script>
const SUPABASE_URL = "https://npqxqfxzykvpwwrrrupc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_djOkmwydtJ-WFW3veBk3RA_-Ryqv6lw";

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const panelLogin = document.getElementById('panelLogin');
const panelPrincipal = document.getElementById('panelPrincipal');
const btnLogout = document.getElementById('btnLogout');
const msg = document.getElementById('msg');
const msg2 = document.getElementById('msg2');
const msgRev = document.getElementById('msgRev');
const msgTrip = document.getElementById('msgTrip');
const msgCruce = document.getElementById('msgCruce');

const DIAS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

async function checkSesion() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    mostrarPanelPrincipal();
  } else {
    panelLogin.style.display = 'block';
    panelPrincipal.style.display = 'none';
    btnLogout.style.display = 'none';
    document.body.classList.add('vista-login');
    document.body.classList.remove('vista-panel');
  }
}

function mostrarPanelPrincipal() {
  panelLogin.style.display = 'none';
  panelPrincipal.style.display = 'block';
  btnLogout.style.display = 'block';
  document.body.classList.add('vista-panel');
  document.body.classList.remove('vista-login');
  cargarLista();
  cargarListaRevistas();
  cargarListaTripulantes();
  cargarListaCruces();
}

// Ojito para mostrar/ocultar la contraseña
const loginPass = document.getElementById('loginPass');
const btnOjo = document.getElementById('btnOjo');
const iconoOjo = document.getElementById('iconoOjo');

const OJO_ABIERTO = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle>';
const OJO_CERRADO = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.7 19.7 0 0 1 4.22-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.7 19.7 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

btnOjo.addEventListener('click', () => {
  const estabaOculta = loginPass.type === 'password';
  loginPass.type = estabaOculta ? 'text' : 'password';
  iconoOjo.innerHTML = estabaOculta ? OJO_ABIERTO : OJO_CERRADO;
  btnOjo.setAttribute('aria-label', estabaOculta ? 'Ocultar contraseña' : 'Mostrar contraseña');
});

document.getElementById('btnLogin').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = loginPass.value;
  msg.textContent = 'Ingresando...';
  msg.className = '';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    msg.textContent = 'Clave o email incorrectos.';
    msg.className = 'error';
  } else {
    msg.textContent = '';
    mostrarPanelPrincipal();
  }
});

btnLogout.addEventListener('click', async () => {
  try {
    await sb.auth.signOut();
  } catch (e) {
    console.error('Error al cerrar sesión:', e);
  } finally {
    window.location.href = 'https://www.labalsa.com.uy';
  }
});

const tabBtnRadio = document.getElementById('tabBtnRadio');
const tabBtnRevista = document.getElementById('tabBtnRevista');
const tabBtnCruces = document.getElementById('tabBtnCruces');
const tabBtnTripulantes = document.getElementById('tabBtnTripulantes');
const tabRadio = document.getElementById('tabRadio');
const tabRevista = document.getElementById('tabRevista');
const tabCruces = document.getElementById('tabCruces');
const tabTripulantes = document.getElementById('tabTripulantes');

function mostrarTab(activa) {
  [tabBtnRadio, tabBtnRevista, tabBtnCruces, tabBtnTripulantes].forEach(b => b.classList.remove('activo'));
  [tabRadio, tabRevista, tabCruces, tabTripulantes].forEach(p => p.classList.remove('activo'));
  activa.boton.classList.add('activo');
  activa.panel.classList.add('activo');
}

tabBtnRadio.addEventListener('click', () => mostrarTab({ boton: tabBtnRadio, panel: tabRadio }));
tabBtnRevista.addEventListener('click', () => mostrarTab({ boton: tabBtnRevista, panel: tabRevista }));
tabBtnCruces.addEventListener('click', () => mostrarTab({ boton: tabBtnCruces, panel: tabCruces }));
tabBtnTripulantes.addEventListener('click', () => mostrarTab({ boton: tabBtnTripulantes, panel: tabTripulantes }));

document.getElementById('btnSubir').addEventListener('click', async () => {
  const numero = document.getElementById('numero').value.trim();
  const fecha = document.getElementById('fecha').value;
  const descripcion = document.getElementById('descripcion').value.trim();
  const archivo = document.getElementById('audio').files[0];
  const btn = document.getElementById('btnSubir');

  if (!numero || !fecha || !descripcion || !archivo) {
    msg2.textContent = 'Completá todos los campos y elegí un archivo de audio.';
    msg2.className = 'error';
    return;
  }

  btn.disabled = true;
  msg2.textContent = 'Subiendo audio...';
  msg2.className = '';

  try {
    const fechaObj = new Date(fecha + 'T00:00:00');
    const nombreArchivo = `programa-${numero}-${fecha}-${Date.now()}.mp3`;

    const { error: errSubida } = await sb.storage
      .from('audios')
      .upload(nombreArchivo, archivo, { contentType: archivo.type || 'audio/mpeg' });

    if (errSubida) throw errSubida;

    const { data: urlData } = sb.storage.from('audios').getPublicUrl(nombreArchivo);
    const audioUrl = urlData.publicUrl;

    const dia = DIAS[fechaObj.getDay()];
    const mesLabel = `${MESES[fechaObj.getMonth()]} ${fechaObj.getFullYear()}`;

    const { error: errInsert } = await sb.from('programas').insert({
      numero: parseInt(numero, 10),
      fecha,
      dia,
      mes_label: mesLabel,
      descripcion,
      audio_url: audioUrl
    });

    if (errInsert) throw errInsert;

    msg2.textContent = '¡Programa publicado! Ya aparece en la web.';
    msg2.className = 'ok';
    document.getElementById('numero').value = '';
    document.getElementById('fecha').value = '';
    document.getElementById('descripcion').value = '';
    document.getElementById('audio').value = '';
    cargarLista();

  } catch (e) {
    console.error(e);
    msg2.textContent = 'Error al publicar: ' + (e.message || e);
    msg2.className = 'error';
  } finally {
    btn.disabled = false;
  }
});

async function cargarLista() {
  const cont = document.getElementById('listaProgramas');
  cont.innerHTML = 'Cargando...';
  const { data, error } = await sb
    .from('programas')
    .select('*')
    .order('fecha', { ascending: false })
    .limit(15);

  if (error) {
    cont.innerHTML = 'No se pudo cargar la lista.';
    return;
  }
  if (!data.length) {
    cont.innerHTML = '<p style="opacity:.6">Todavía no hay programas cargados.</p>';
    return;
  }
  cont.innerHTML = '';
  data.forEach(p => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<div><span class="num">#${p.numero}</span>${p.fecha} — ${p.dia}</div>`;
    const btnBorrar = document.createElement('button');
    btnBorrar.textContent = 'Borrar';
    btnBorrar.addEventListener('click', () => borrarPrograma(p.id));
    div.appendChild(btnBorrar);
    cont.appendChild(div);
  });
}

async function borrarPrograma(id) {
  if (!confirm('¿Borrar este programa? Esta acción no se puede deshacer.')) return;
  const { error } = await sb.from('programas').delete().eq('id', id);
  if (error) {
    alert('No se pudo borrar: ' + error.message);
  } else {
    cargarLista();
  }
}

document.getElementById('btnSubirRevista').addEventListener('click', async () => {
  const numero = document.getElementById('revNumero').value.trim();
  const temporada = document.getElementById('revTemporada').value.trim();
  const texto = document.getElementById('revTexto').value.trim();
  const portada = document.getElementById('revPortada').files[0];
  const pdf = document.getElementById('revPdf').files[0];
  const btn = document.getElementById('btnSubirRevista');

  if (!numero || !temporada || !texto || !portada || !pdf) {
    msgRev.textContent = 'Completá todos los campos, la portada y el PDF.';
    msgRev.className = 'error';
    return;
  }

  btn.disabled = true;
  msgRev.textContent = 'Subiendo portada...';
  msgRev.className = '';

  try {
    const sello = Date.now();
    const extPortada = portada.name.split('.').pop();
    const nombrePortada = `portada-${numero}-${sello}.${extPortada}`;

    const { error: errPortada } = await sb.storage
      .from('revistas')
      .upload(nombrePortada, portada, { contentType: portada.type });
    if (errPortada) throw errPortada;

    const { data: urlPortada } = sb.storage.from('revistas').getPublicUrl(nombrePortada);

    msgRev.textContent = 'Subiendo PDF...';
    const nombrePdf = `revista-${numero}-${sello}.pdf`;

    const { error: errPdf } = await sb.storage
      .from('revistas')
      .upload(nombrePdf, pdf, { contentType: 'application/pdf' });
    if (errPdf) throw errPdf;

    const { data: urlPdf } = sb.storage.from('revistas').getPublicUrl(nombrePdf);

    const { error: errInsert } = await sb.from('revistas').insert({
      numero: parseInt(numero, 10),
      temporada,
      texto,
      portada_url: urlPortada.publicUrl,
      pdf_url: urlPdf.publicUrl
    });
    if (errInsert) throw errInsert;

    msgRev.textContent = '¡Edición publicada! Ya es la que se muestra en la web.';
    msgRev.className = 'ok';
    document.getElementById('revNumero').value = '';
    document.getElementById('revTemporada').value = '';
    document.getElementById('revTexto').value = '';
    document.getElementById('revPortada').value = '';
    document.getElementById('revPdf').value = '';
    cargarListaRevistas();

  } catch (e) {
    console.error(e);
    msgRev.textContent = 'Error al publicar: ' + (e.message || e);
    msgRev.className = 'error';
  } finally {
    btn.disabled = false;
  }
});

const cruceTipo = document.getElementById('cruceTipo');
const cruceCampoEnlace = document.getElementById('cruceCampoEnlace');
const cruceCampoAudio = document.getElementById('cruceCampoAudio');
const cruceCampoImagen = document.getElementById('cruceCampoImagen');

cruceTipo.addEventListener('change', () => {
  cruceCampoEnlace.style.display = cruceTipo.value === 'enlace' ? 'block' : 'none';
  cruceCampoAudio.style.display = cruceTipo.value === 'audio' ? 'block' : 'none';
  cruceCampoImagen.style.display = cruceTipo.value === 'imagen' ? 'block' : 'none';
});

document.getElementById('btnSubirCruce').addEventListener('click', async () => {
  const titulo = document.getElementById('cruceTitulo').value.trim();
  const descripcion = document.getElementById('cruceDescripcion').value.trim();
  const imagen = document.getElementById('cruceImagen').files[0];
  const tipo = cruceTipo.value;
  const btn = document.getElementById('btnSubirCruce');

  const enlaceVal = document.getElementById('cruceEnlace').value.trim();
  const audioFile = document.getElementById('cruceAudio').files[0];
  const imagenExtraFile = document.getElementById('cruceImagenExtra').files[0];

  if (!titulo || !descripcion || !imagen) {
    msgCruce.textContent = 'Completá título, descripción e imagen de portada.';
    msgCruce.className = 'error';
    return;
  }
  if (tipo === 'enlace' && !enlaceVal) {
    msgCruce.textContent = 'Ingresá la URL del enlace.';
    msgCruce.className = 'error';
    return;
  }
  if (tipo === 'audio' && !audioFile) {
    msgCruce.textContent = 'Elegí un archivo de audio.';
    msgCruce.className = 'error';
    return;
  }
  if (tipo === 'imagen' && !imagenExtraFile) {
    msgCruce.textContent = 'Elegí la imagen adicional.';
    msgCruce.className = 'error';
    return;
  }

  btn.disabled = true;
  msgCruce.textContent = 'Subiendo portada...';
  msgCruce.className = '';

  try {
    const sello = Date.now();
    const extImagen = imagen.name.split('.').pop();
    const nombreImagen = `portada-${sello}.${extImagen}`;

    const { error: errImagen } = await sb.storage
      .from('cruces')
      .upload(nombreImagen, imagen, { contentType: imagen.type });
    if (errImagen) throw errImagen;

    const { data: urlImagen } = sb.storage.from('cruces').getPublicUrl(nombreImagen);

    let contenidoUrl = '';

    if (tipo === 'enlace') {
      contenidoUrl = enlaceVal;
    } else if (tipo === 'audio') {
      msgCruce.textContent = 'Subiendo audio...';
      const extAudio = audioFile.name.split('.').pop();
      const nombreAudio = `audio-${sello}.${extAudio}`;
      const { error: errAudio } = await sb.storage
        .from('cruces')
        .upload(nombreAudio, audioFile, { contentType: audioFile.type || 'audio/mpeg' });
      if (errAudio) throw errAudio;
      const { data: urlAudio } = sb.storage.from('cruces').getPublicUrl(nombreAudio);
      contenidoUrl = urlAudio.publicUrl;
    } else if (tipo === 'imagen') {
      msgCruce.textContent = 'Subiendo imagen adicional...';
      const extImgExtra = imagenExtraFile.name.split('.').pop();
      const nombreImgExtra = `extra-${sello}.${extImgExtra}`;
      const { error: errImgExtra } = await sb.storage
        .from('cruces')
        .upload(nombreImgExtra, imagenExtraFile, { contentType: imagenExtraFile.type });
      if (errImgExtra) throw errImgExtra;
      const { data: urlImgExtra } = sb.storage.from('cruces').getPublicUrl(nombreImgExtra);
      contenidoUrl = urlImgExtra.publicUrl;
    }

    const { error: errInsert } = await sb.from('cruces').insert({
      titulo,
      descripcion,
      imagen_url: urlImagen.publicUrl,
      tipo,
      contenido_url: contenidoUrl
    });
    if (errInsert) throw errInsert;

    msgCruce.textContent = '¡Cruce publicado!';
    msgCruce.className = 'ok';
    document.getElementById('cruceTitulo').value = '';
    document.getElementById('cruceDescripcion').value = '';
    document.getElementById('cruceImagen').value = '';
    document.getElementById('cruceEnlace').value = '';
    document.getElementById('cruceAudio').value = '';
    document.getElementById('cruceImagenExtra').value = '';
    cargarListaCruces();

  } catch (e) {
    console.error(e);
    msgCruce.textContent = 'Error al publicar: ' + (e.message || e);
    msgCruce.className = 'error';
  } finally {
    btn.disabled = false;
  }
});

async function cargarListaCruces() {
  const cont = document.getElementById('listaCruces');
  cont.innerHTML = 'Cargando...';
  const { data, error } = await sb
    .from('cruces')

  if (error) {
    cont.innerHTML = 'No se pudo cargar la lista.';
    return;

  if (!data.length) {

  cont.innerHTML = '';
  data.forEach(c => {

async function borrarCruce(id) {
  if (!confirm('¿Borrar este cruce? Esta acción no se puede deshacer.')) return;

  }
}
